<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Espace de gestion · Express'Eau Assainissement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2305080C%27/%3E%3Cpath d=%27M16 5c4 6 7 9 7 13a7 7 0 1 1-14 0c0-4 3-7 7-13z%27 fill=%27%230B8CF3%27/%3E%3C/svg%3E">
<style>
:root{
  --orange:#F67A05;--vif:#FF9226;--bleu:#0B8CF3;--bleu2:#4FB4FF;
  --noir:#05080C;--gris:#0B1119;--gris2:#121A24;--blanc:#F5F8FA;
  --fume:rgba(245,248,250,.62);--ligne:rgba(120,180,235,.16);
  --vert:#16A46B;--rouge:#E5484D;--or:#D3B169;
  --d:'Anton',Impact,sans-serif;--b:'IBM Plex Sans',system-ui,sans-serif;--m:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--noir);color:var(--blanc);font-family:var(--b);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,94vw);margin:0 auto}
.mono{font-family:var(--m);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
h1,h2{font-family:var(--d);font-weight:400;text-transform:uppercase;line-height:.95}
input,textarea,select,button{font-family:var(--b)}
input,textarea,select{width:100%;background:var(--gris2);border:1px solid var(--ligne);color:var(--blanc);
  padding:11px 12px;font-size:.95rem;border-radius:8px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--bleu);outline-offset:-1px}
label{display:block;font-family:var(--m);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fume);margin:0 0 6px}
.champ{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{border:1px solid var(--ligne);background:transparent;color:var(--blanc);padding:9px 14px;border-radius:999px;
  font-size:.85rem;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap;display:inline-block;text-align:center}
.btn:hover{border-color:var(--bleu);color:var(--bleu2)}
.btn.plein{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.plein:hover{background:var(--vif)}
.btn.vert{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.sup{border-color:rgba(229,72,77,.5);color:#ff9ea1}
.btn.sup:hover{background:rgba(229,72,77,.14);color:#ffc9cb}
.btn:disabled{opacity:.5;cursor:default}

header{position:sticky;top:0;z-index:30;background:rgba(5,8,12,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--ligne)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-family:var(--d);font-size:1.1rem;line-height:.85;transform:skewX(-8deg)}
.logo i{color:var(--bleu);font-style:normal}
.logo b{display:block;font-family:var(--m);font-size:.48rem;font-weight:400;letter-spacing:.2em;color:var(--fume);transform:skewX(8deg)}
.sp{margin-left:auto}
nav.onglets{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--ligne);padding:8px 0}
nav.onglets button{border:0;background:transparent;color:var(--fume);padding:9px 15px;border-radius:999px;
  font-size:.9rem;font-weight:600;cursor:pointer;white-space:nowrap}
nav.onglets button[aria-selected="true"]{background:var(--gris2);color:var(--blanc)}
nav.onglets .pt{display:inline-block;margin-left:7px;background:var(--orange);color:#fff;border-radius:999px;
  font-family:var(--m);font-size:.62rem;padding:1px 7px}

.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(420px,94vw);background:var(--gris);border:1px solid var(--ligne);border-radius:14px;padding:clamp(24px,5vw,36px)}
.card h1{font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:6px}
.erreur{background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.5);color:#ffc9cb;padding:11px 13px;border-radius:8px;font-size:.88rem;margin-bottom:14px;display:none}
.erreur.on{display:block}

main{padding:20px 0 90px;display:none}
main.on{display:block}
.vue{display:none}.vue.on{display:block}
.titre{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.titre h2{font-size:clamp(1.4rem,3.6vw,2rem)}
.compteurs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--gris);border:1px solid var(--ligne);border-radius:12px;padding:15px 13px}
.kpi b{display:block;font-family:var(--d);font-size:clamp(1.4rem,3.6vw,2rem);line-height:1;color:var(--bleu2)}
.kpi span{font-size:.76rem;color:var(--fume)}
.kpi.alerte b{color:var(--orange)}.kpi.vert b{color:#4ADE9B}
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.filtres button{border:1px solid var(--ligne);background:transparent;color:var(--fume);padding:8px 13px;border-radius:999px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.filtres button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:600}

.liste{display:flex;flex-direction:column;gap:11px}
.item{background:var(--gris);border:1px solid var(--ligne);border-radius:12px;overflow:hidden}
.item .tete{display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer}
.item .qui{flex:1;min-width:0}
.item .qui strong{display:block;font-size:.99rem}
.item .qui em{font-style:normal;font-size:.81rem;color:var(--fume)}
.pastille{font-family:var(--m);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
.p-nouveau,.p-brouillon{background:rgba(246,122,5,.18);color:var(--orange);border:1px solid rgba(246,122,5,.45)}
.p-rappele,.p-envoye{background:rgba(11,140,243,.16);color:var(--bleu2);border:1px solid rgba(11,140,243,.45)}
.p-devis_envoye{background:rgba(211,177,105,.16);color:var(--or);border:1px solid rgba(211,177,105,.45)}
.p-gagne,.p-accepte{background:rgba(22,164,107,.16);color:#4ADE9B;border:1px solid rgba(22,164,107,.45)}
.p-perdu,.p-refuse,.p-expire{background:rgba(245,248,250,.08);color:var(--fume);border:1px solid var(--ligne)}
.chev{color:var(--fume);font-size:1.05rem;transition:transform .2s}
.item.ouvert .chev{transform:rotate(90deg)}
.item .corps{display:none;padding:0 16px 16px;border-top:1px solid var(--ligne)}
.item.ouvert .corps{display:block}
.infos{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--ligne);border:1px solid var(--ligne);border-radius:10px;overflow:hidden;margin:15px 0}
.infos div{background:var(--gris2);padding:10px 12px}
.infos .k{font-family:var(--m);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fume);display:block;margin-bottom:3px}
.infos .v{font-size:.9rem;word-break:break-word}
.msg{background:var(--gris2);border:1px solid var(--ligne);border-radius:10px;padding:12px;font-size:.9rem;white-space:pre-wrap;margin-bottom:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
.actions .btn{flex:1 1 auto;min-width:120px}
.statuts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.statuts button{border:1px solid var(--ligne);background:transparent;color:var(--fume);padding:8px 12px;border-radius:8px;font-size:.81rem;cursor:pointer}
.statuts button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:600}
.vide{text-align:center;color:var(--fume);padding:46px 20px;border:1px dashed var(--ligne);border-radius:12px}



@media(max-width:760px){
  .compteurs{grid-template-columns:1fr 1fr}
  .infos,.g2,.g3{grid-template-columns:1fr}
  .actions .btn{flex:1 1 46%;min-width:0}
        }
</style>
</head>
<body>

<section class="login" id="ecranLogin">
  <form class="card" id="formLogin">
    <h1>Espace<br>de gestion</h1>
    <p style="color:var(--fume);font-size:.92rem;margin-bottom:24px">Toutes les demandes envoyées depuis votre site.</p>
    <div class="erreur" id="errLogin"></div>
    <div class="champ"><label for="identifiant">Identifiant</label><input id="identifiant" name="username" autocapitalize="none" autocomplete="username" required></div>
    <div class="champ"><label for="motdepasse">Mot de passe</label><input id="motdepasse" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn plein" style="width:100%;padding:13px" id="btnLogin">Se connecter</button>
  </form>
</section>

<header id="entete" style="display:none">
  <div class="bar wrap">
    <span class="logo">Express<i>'Eau</i><b>Espace de gestion</b></span>
    <span class="sp"></span>
    <button class="btn" id="btnRefresh">Actualiser</button>
    <button class="btn" id="btnLogout">Quitter</button>
  </div>
  <div class="wrap">
    <nav class="onglets" id="onglets">
      <button data-v="demandes" aria-selected="true">Demandes <span class="pt" id="ptDem">0</span></button>
      <button data-v="reglages" aria-selected="false">Mes coordonnées</button>
    </nav>
  </div>
</header>

<main id="ecranAdmin">
  <div class="wrap">

    <section class="vue on" id="v-demandes">
      <div class="titre"><h2>Vos demandes</h2><span class="mono" style="color:var(--fume)" id="maj"></span></div>
      <div class="compteurs">
        <div class="kpi alerte"><b id="kNouveau">0</b><span>à rappeler</span></div>
        <div class="kpi"><b id="kSemaine">0</b><span>cette semaine</span></div>
        <div class="kpi"><b id="kDevis">0</b><span>devis envoyés</span></div>
        <div class="kpi vert"><b id="kGagne">0</b><span>chantiers signés</span></div>
      </div>
      <div class="filtres" id="filtresDem">
        <button data-f="tous" aria-pressed="true">Tout</button>
        <button data-f="nouveau">À rappeler</button>
        <button data-f="rappele">Rappelés</button>
        <button data-f="devis_envoye">Devis envoyés</button>
        <button data-f="gagne">Signés</button>
        <button data-f="perdu">Sans suite</button>
      </div>
      <div class="liste" id="listeDem"><div class="vide">Chargement…</div></div>
    </section>

    <section class="vue" id="v-reglages">
      <div class="titre"><h2>Mes coordonnées</h2></div>
      <p style="color:var(--fume);font-size:.92rem;margin-bottom:16px">Vos coordonnées, utilisées pour l'espace de gestion et les notifications.</p>
      <form id="formReglages">
        <div class="bloc"><h3>Identité</h3>
          <div class="g2">
            <div class="champ"><label>Raison sociale</label><input name="raison_sociale"></div>
            <div class="champ"><label>Forme juridique</label><input name="forme" placeholder="Entreprise individuelle, SASU…"></div>
          </div>
          <div class="champ"><label>Adresse</label><input name="adresse"></div>
          <div class="g2">
            <div class="champ"><label>Code postal</label><input name="code_postal"></div>
            <div class="champ"><label>Ville</label><input name="ville"></div>
          </div>
          <div class="g3">
            <div class="champ"><label>Téléphone</label><input name="telephone"></div>
            <div class="champ"><label>Email</label><input name="email"></div>
            <div class="champ"><label>Site</label><input name="site"></div>
          </div>
        </div>
        <button class="btn plein" id="btnReglages" style="padding:13px 24px">Enregistrer</button>
      </form>
    </section>

  </div>
</main>


<script>
const API='https://bxdnxnwbslykpgfsdltg.supabase.co/functions/v1/express-eau';
const CLE='eea_jeton';
let jeton=localStorage.getItem(CLE)||'';
let demandes=[],reglages={};
let fDem='tous',ouvDem=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' \u20AC';
const nb=v=>{const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:0};

async function appel(c){
  const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(c)});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&c.action!=='connexion'){deconnexion();throw new Error('session expirée')}
  if(!r.ok)throw new Error(d.erreur||'erreur');
  return d;
}

$('#formLogin').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=$('#errLogin'),b=$('#btnLogin');
  err.classList.remove('on');b.disabled=true;b.textContent='Connexion…';
  try{
    const d=await appel({action:'connexion',identifiant:$('#identifiant').value.trim().toLowerCase(),mot_de_passe:$('#motdepasse').value});
    jeton=d.jeton;localStorage.setItem(CLE,jeton);$('#motdepasse').value='';ouvrir();
  }catch(ex){err.textContent=ex.message;err.classList.add('on')}
  finally{b.disabled=false;b.textContent='Se connecter'}
});
function deconnexion(){jeton='';localStorage.removeItem(CLE);$('#ecranLogin').style.display='grid';$('#entete').style.display='none';$('#ecranAdmin').classList.remove('on')}
$('#btnLogout').addEventListener('click',async()=>{try{await appel({action:'deconnexion',jeton})}catch(e){}deconnexion()});
function ouvrir(){$('#ecranLogin').style.display='none';$('#entete').style.display='block';$('#ecranAdmin').classList.add('on');toutCharger()}

$('#onglets').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  $('#onglets').querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true');
  document.querySelectorAll('.vue').forEach(v=>v.classList.remove('on'));
  $('#v-'+b.dataset.v).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
});

async function toutCharger(){
  try{
    const r=await Promise.all([appel({action:'liste',jeton}),appel({action:'reglages',jeton})]);
    demandes=r[0].demandes||[];reglages=r[1].reglages||{};
    $('#maj').textContent='mis à jour à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    compterDem();dessinerDem();remplirReglages();
  }catch(ex){$('#listeDem').innerHTML='<div class="vide">'+esc(ex.message)+'</div>'}
}
$('#btnRefresh').addEventListener('click',toutCharger);

/* ===== DEMANDES ===== */
const LIBD={nouveau:'À rappeler',rappele:'Rappelé',devis_envoye:'Devis envoyé',gagne:'Signé',perdu:'Sans suite'};
function quand(iso){
  const d=new Date(iso),j=Math.floor((Date.now()-d)/864e5),h=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return j===0?"aujourd'hui à "+h:j===1?'hier à '+h:d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' à '+h;
}
function compterDem(){
  const s=Date.now()-7*864e5,n=demandes.filter(d=>d.statut==='nouveau').length;
  $('#kNouveau').textContent=n;$('#ptDem').textContent=n;$('#ptDem').style.display=n?'inline-block':'none';
  $('#kSemaine').textContent=demandes.filter(d=>new Date(d.cree_le).getTime()>s).length;
  $('#kDevis').textContent=demandes.filter(d=>d.statut==='devis_envoye').length;
  $('#kGagne').textContent=demandes.filter(d=>d.statut==='gagne').length;
}
function dessinerDem(){
  const l=fDem==='tous'?demandes:demandes.filter(d=>d.statut===fDem);
  if(!l.length){$('#listeDem').innerHTML='<div class="vide">Aucune demande dans cette catégorie.</div>';return}
  $('#listeDem').innerHTML=l.map(d=>{
    const tel=(d.telephone||'').replace(/\s/g,'');
    const nom=[d.prenom,d.nom].filter(Boolean).join(' ')||'Sans nom';
    const infos=[['Téléphone',d.telephone],['Email',d.email],['Adresse',d.adresse],
      ['Commune',[d.code_postal,d.commune].filter(Boolean).join(' ')],
      ['Personnes au foyer',d.nb_personnes],['Maison',d.type_maison],
      ['Objet',d.motif],['Reçue le',new Date(d.cree_le).toLocaleString('fr-FR')]]
      .filter(x=>x[1]||x[1]===0)
      .map(x=>'<div><span class="k">'+x[0]+'</span><span class="v">'+esc(x[1])+'</span></div>').join('');
    return '<article class="item'+(ouvDem===d.id?' ouvert':'')+'" data-id="'+d.id+'">'+
      '<div class="tete" data-toggle><span class="chev">›</span>'+
        '<span class="qui"><strong>'+esc(nom)+'</strong><em>'+esc(d.motif||'Demande')+' · '+esc(d.commune||'')+' · '+quand(d.cree_le)+'</em></span>'+
        '<span class="pastille p-'+d.statut+'">'+(LIBD[d.statut]||d.statut)+'</span></div>'+
      '<div class="corps"><div class="infos">'+infos+'</div>'+
        (d.message?'<div class="msg">'+esc(d.message)+'</div>':'')+
        '<div class="actions">'+
          (tel?'<a class="btn plein" href="tel:'+esc(tel)+'">Appeler</a><a class="btn" href="sms:'+esc(tel)+'">SMS</a>':'')+
          (d.email?'<a class="btn" href="mailto:'+esc(d.email)+'">Email</a>':'')+
          '</div>'+
        '<div class="statuts">'+Object.keys(LIBD).map(s=>'<button data-statut="'+s+'" aria-pressed="'+(d.statut===s)+'">'+LIBD[s]+'</button>').join('')+'</div>'+
        '<label>Note interne</label>'+
        '<textarea data-note rows="2" placeholder="Ce que vous avez convenu, le montant annoncé, la date de visite…">'+esc(d.note_interne||'')+'</textarea>'+
        '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-savenote>Enregistrer la note</button><button class="btn sup" data-sup>Supprimer</button></div>'+
      '</div></article>';
  }).join('');
}
$('#filtresDem').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  $('#filtresDem').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');fDem=b.dataset.f;dessinerDem()});

$('#listeDem').addEventListener('click',async e=>{
  const art=e.target.closest('.item');if(!art)return;const id=art.dataset.id;
  if(e.target.closest('[data-toggle]')){ouvDem=art.classList.contains('ouvert')?null:id;dessinerDem();return}
  const st=e.target.closest('[data-statut]');
  if(st){try{await appel({action:'statut',jeton,id,statut:st.dataset.statut});
    const d=demandes.find(x=>x.id===id);if(d)d.statut=st.dataset.statut;compterDem();dessinerDem()}catch(ex){alert(ex.message)}return}
  if(e.target.closest('[data-savenote]')){
    const t=art.querySelector('[data-note]'),b=e.target.closest('[data-savenote]');b.disabled=true;b.textContent='Enregistrement…';
    try{await appel({action:'note',jeton,id,note_interne:t.value});const d=demandes.find(x=>x.id===id);if(d)d.note_interne=t.value;
      b.textContent='Note enregistrée';setTimeout(()=>{b.disabled=false;b.textContent='Enregistrer la note'},1500)}
    catch(ex){alert(ex.message);b.disabled=false;b.textContent='Enregistrer la note'}return}
  if(e.target.closest('[data-sup]')){
    if(!confirm('Supprimer définitivement cette demande ?'))return;
    try{await appel({action:'supprimer',jeton,id});demandes=demandes.filter(x=>x.id!==id);ouvDem=null;compterDem();dessinerDem()}catch(ex){alert(ex.message)}return}
});

/* ===== RÉGLAGES ===== */
function remplirReglages(){
  const f=$('#formReglages');
  for(const el of f.elements) if(el.name&&reglages[el.name]!==undefined&&reglages[el.name]!==null) el.value=reglages[el.name];
}
$('#formReglages').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=$('#btnReglages');b.disabled=true;b.textContent='Enregistrement…';
  const r={};for(const el of e.target.elements) if(el.name) r[el.name]=el.value;
  try{await appel({action:'reglages_maj',jeton,reglages:r});reglages=Object.assign({},reglages,r);
    b.textContent='Enregistré';setTimeout(()=>{b.disabled=false;b.textContent='Enregistrer'},1500)}
  catch(ex){alert(ex.message);b.disabled=false;b.textContent='Enregistrer'}
});

if(jeton) appel({action:'liste',jeton}).then(()=>ouvrir()).catch(()=>deconnexion());
setInterval(()=>{if(jeton&&$('#ecranAdmin').classList.contains('on'))toutCharger()},180000);
</script>
</body>
</html>
